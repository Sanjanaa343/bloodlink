<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration | BloodLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body class="d-flex align-items-center vh-100 py-4">
    <div class="container" style="max-width: 500px;">
        <div class="text-center text-white mb-3">
            <h3 class="fw-bold"><i class="fa-solid fa-droplet text-danger me-2"></i>Voluntary Donor Sign Up</h3>
            <p class="text-muted small">Register to receive emergency blood match alerts in your area</p>
        </div>

        <div class="card p-4 shadow-lg">
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Blood Group</label>
                        <select name="blood_group" class="form-select" required>
                            <option value="O-">O- (Universal)</option>
                            <option value="O+">O+</option>
                            <option value="A-">A-</option>
                            <option value="A+">A+</option>
                            <option value="B-">B-</option>
                            <option value="B+">B+</option>
                            <option value="AB-">AB-</option>
                            <option value="AB+">AB+</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Registered Area</label>
                        <input type="text" name="area" class="form-control" placeholder="e.g. Tiruchirappalli" required>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="availability" name="availability" checked>
                        <label class="form-check-label small" for="availability">
                            Mark me as currently available for emergency requests
                        </label>
                    </div>
                </div>

                <div class="alert alert-secondary p-2 mb-3" style="font-size:0.75rem;">
                    <i class="fa-solid fa-circle-info me-1"></i> Note: Registration identifies potential donor matches only. Medical eligibility screening is conducted at authorized blood banks.
                </div>

                <button type="submit" class="btn btn-danger w-100 fw-semibold">Complete Registration</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
