<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Emergency Portal | BloodLink Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-width: 250px; --bg-main: #f8fafc; --navy-dark: #0f172a; --navy-primary: #1e293b; --red-accent: #dc2626; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-main); color: #334155; margin: 0; }
        #wrapper { display: flex; width: 100%; min-height: 100vh; }
        #sidebar { width: var(--sidebar-width); background-color: var(--navy-dark); color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
        #sidebar .sidebar-brand { padding: 1.25rem 1.5rem; font-size: 1.25rem; font-weight: 700; border-bottom: 1px solid #334155; color: #fff; text-decoration: none; }
        #sidebar .nav-link { color: #94a3b8; padding: 0.85rem 1.5rem; font-size: 0.95rem; border-left: 3px solid transparent; }
        #sidebar .nav-link.active { color: #fff; background-color: var(--navy-primary); border-left-color: var(--red-accent); }
        #content-wrapper { flex-grow: 1; display: flex; flex-direction: column; }
        .top-navbar { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 1.5rem; }
        .main-content { padding: 1.75rem; flex-grow: 1; }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="sidebar">
            <a href="index.html" class="sidebar-brand d-flex align-items-center"><i class="fa-solid fa-droplet text-danger me-2"></i><span>BloodLink</span></a>
            <div class="nav flex-column mt-3"><a class="nav-link active"><i class="fa-solid fa-truck-medical me-2"></i> Emergency Requests</a></div>
            <div class="mt-auto p-3 border-top border-secondary text-muted small">Connected: <span class="badge bg-success">Live Preview</span></div>
        </div>

        <div id="content-wrapper">
            <nav class="top-navbar d-flex justify-content-between align-items-center">
                <h5 class="m-0 text-secondary">Hospital Emergency Dashboard</h5>
                <div class="d-flex align-items-center gap-3">
                    <span class="fw-semibold text-dark">City Hospital ER Staff</span>
                    <a href="index.html" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </nav>

            <main class="main-content">
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <div class="card p-3">
                            <h6 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i> Create Emergency Blood Request</h6>
                            <form onsubmit="createEmergencyRequest(event)">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Blood Group Required</label>
                                    <select class="form-select" id="blood_group">
                                        <option value="O-">O- (Critical / Universal)</option>
                                        <option value="O+">O+</option>
                                        <option value="A+">A+</option>
                                        <option value="B+">B+</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Units Required</label>
                                    <input type="number" class="form-control" id="units_required" min="1" value="4" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Urgency Level</label>
                                    <select class="form-select" id="urgency">
                                        <option value="CRITICAL">Critical (Immediate)</option>
                                        <option value="HIGH">High (&lt; 2 Hours)</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-danger w-100">Broadcast Request</button>
                            </form>
                        </div>
                    </div>

                    <div class="col-md-7">
                        <div class="card p-3">
                            <h6 class="fw-bold mb-3">Active Emergency Requests</h6>
                            <div id="hospital-requests-list">
                                <div class="border rounded p-3 mb-2 bg-light">
                                    <div class="d-flex justify-content-between">
                                        <span class="fw-bold text-danger">O- (4 Units) - CRITICAL</span>
                                        <span class="badge bg-warning text-dark">Searching</span>
                                    </div>
                                    <div class="small text-muted mt-1">Status: Checking blood bank availability...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function createEmergencyRequest(event) {
            event.preventDefault();
            const bg = document.getElementById('blood_group').value;
            const units = document.getElementById('units_required').value;
            const urgency = document.getElementById('urgency').value;

            const list = document.getElementById('hospital-requests-list');
            const newReq = document.createElement('div');
            newReq.className = 'border rounded p-3 mb-2 bg-light';
            newReq.innerHTML = `<div class="d-flex justify-content-between"><span class="fw-bold text-danger">${bg} (${units} Units) - ${urgency}</span><span class="badge bg-warning text-dark">Searching</span></div><div class="small text-muted mt-1">Status: Broadcast sent to nearby blood banks...</div>`;
            list.prepend(newReq);
        }
    </script>
</body>
</html>
